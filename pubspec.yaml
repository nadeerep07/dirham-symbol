name: dirham_symbol
description: Official UAE Dirham (AED) currency symbol, widget, and formatter for Flutter. Display Dirham icon, Arabic (د.إ), prices, and inputs with .toDirham().
version: 0.5.2
homepage: https://www.nadeerep.in/
repository: https://github.com/nadeerep07/dirham-symbol
issue_tracker: https://github.com/nadeerep07/dirham-symbol/issues
topics:
  - currency
  - uae
  - dirham
  - ecommerce
  - formatting

screenshots:
  - description: 'Official UAE Dirham symbol icon and price formatting'
    path: screenshots/examples.png
  - description: 'E-Commerce sale prices, strikethrough discounts, and badges'
    path: screenshots/light_mode.png
  - description: 'Dark mode Dirham symbols and price widgets'
    path: screenshots/dark_mode.png

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: '>=0.18.0 <1.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  fonts:
    - family: Dirham
      fonts:
        - asset: fonts/dirham_font.ttf
